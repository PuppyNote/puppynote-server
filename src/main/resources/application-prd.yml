spring:
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/puppynote?useSSL=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.MySQL8Dialect
        #        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          exception-handling: ignore

  mail:
    host: smtp.gmail.com
    port: 587
    username: puppynote0330@gmail.com
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6380
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_HOST}
      chat:
        model: gemma4:12b
        options:
          temperature: 0.3

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash-lite

openmeteo:
  api:
    url: https://api.open-meteo.com

oauth:
  kakao:
    api:
      url: https://kapi.kakao.com
      name: kakaoApi
  google:
    api:
      url: https://www.googleapis.com
      name: googleApi

jwt:
  secret-key: ${JWT_SECRET_KEY}

# 브라우저에서 직접 호출하는 클라이언트의 Origin 목록. 도메인 추가 시 이 목록에만 추가하면 된다.
# 정확한 Origin(https://web.puppynote.co.kr)과 포트 패턴(http://localhost:[*]) 둘 다 사용 가능하다.
cors:
  allowed-origin-patterns:
    - "https://www.quitmate.co.kr"   # TODO 퍼피노트와 무관한 도메인으로 보임. 사용처 확인 후 제거
    - "https://quitmate.co.kr"       # TODO 상동
    - "http://localhost:[*]"         # TODO 모바일 웹 개발용. 운영 도메인 확정 후 제거
    - "http://127.0.0.1:[*]"         # TODO 상동
  max-age: 3600

aws:
  access-key: ${AWS_ACCESS_KEY}  # AWS IAM Access Key
  secret-key: ${AWS_SECRET_KEY}  # AWS IAM Secret Key
  s3:
    region: ap-northeast-2  # Seoul Region
    bucket:
      name: puppynote-prd  # 통합 버킷
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN}  # https://xxxxxx.cloudfront.net

elasticsearch:
  host: ${ES_HOST}
  port: 9200
  username: ${ES_USERNAME}
  password: ${ES_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: puppynote-prd



log-agent:
  webhook-url: https://log-agent-api.sangkihan.co.kr/api/v1/webhook/error
  server-name: puppynote
  server-ip: ${SERVER_IP}