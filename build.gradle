plugins {
    id 'java'
}

allprojects {
    group = 'com.puppynoteserver'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
        maven { url 'https://repo.spring.io/release' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = '17'
    }

    // compileOnly/annotationProcessor는 project(':...') 의존으로는 전파되지 않으므로
    // 여기서 모든 서브모듈에 직접 주입한다. apps:legacy는 원래대로 자체 선언을 그대로 쓰도록 제외.
    if (project.path != ':apps:legacy') {
        dependencies {
            compileOnly 'org.projectlombok:lombok:1.18.36'
            annotationProcessor 'org.projectlombok:lombok:1.18.36'

            // QueryDSL Q클래스 생성기 - querydsl-jpa 런타임 라이브러리는 contracts:common이 'api'로 전파하지만
            // annotationProcessor는 그 전파 대상이 아니라서 여기서 공통 주입한다. 엔티티가 없는 모듈에는 그냥 no-op.
            // 버전은 spring-boot-dependencies(3.4.2)가 관리하는 값 그대로 고정한다.
            annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
            annotationProcessor 'jakarta.annotation:jakarta.annotation-api:2.1.1'
            annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'
        }

        def querydslDir = "src/main/generated"

        sourceSets {
            main.java.srcDir querydslDir
        }

        tasks.withType(JavaCompile) {
            options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
        }

        clean.doLast {
            file(querydslDir).deleteDir()
        }
    }
}
