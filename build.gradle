plugins {
    id 'java'
}

allprojects {
    group = 'com.puppynoteserver'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
        maven { url 'https://repo.spring.io/release' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = '17'
    }
}
