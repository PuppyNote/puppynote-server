plugins {
    id 'java'
    // bootJar/bootRun 태스크 및 실행 가능한 jar 패키징을 위해 각 서비스 모듈에 개별 적용이 필요하다.
    // (Gradle 플러그인은 project(':contracts:common') 의존만으로는 전파되지 않는다.)
    id 'org.springframework.boot' version '3.4.2'
}

dependencies {
    // spring-boot-starter, spring-security, spring-data-jpa 등은 contracts:common이 'api'로 전파한다.
    // lombok은 루트 build.gradle의 subprojects 블록에서 공통 주입된다.
    implementation project(':contracts:common')
    implementation project(':contracts:user-api')

    // SmtpEmailAdapter(JavaMailSender)용 - user 서비스만 쓰므로 common이 아닌 여기에 선언
    implementation 'org.springframework.boot:spring-boot-starter-mail'
}
